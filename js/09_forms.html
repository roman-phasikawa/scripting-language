<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validation</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: sans-serif;
      }
      .form-container {
        background: #ffffff;
        padding: 24px;
        border: 1px solid black;
        border-radius: 8px;
        width: 320px;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 300px;
      }
      input {
        width: 100%;
        padding: 4px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h1>Form Validation</h1>
      <form name="myform" id="myForm" onsubmit="validateform(event)" novalidate>
        Name:
        <input
          type="text"
          id="fname"
          name="fname"
          placeholder="Enter your name"
        />
        Email:
        <input
          type="text"
          id="email"
          name="email"
          placeholder="e.g. user@example.com"
        />
        Age:
        <input type="text" id="age" />

        Username (required):
        <input
          type="text"
          id="username"
          name="username"
          required
          placeholder="Required field"
        />

        Score (min=0, max=100):
        <input
          type="number"
          id="score"
          name="score"
          min="0"
          max="100"
          placeholder="0 to 100"
        />

        Form ID (readonly):
        <input
          type="text"
          id="formId"
          name="formId"
          value="FORM-2026"
          readonly
        />

        Promo Code (disabled):
        <input
          type="text"
          id="promo"
          name="promo"
          value="NOT-AVAILABLE"
          disabled
        />

        Select Emails (multiple):
        <input
          type="email"
          id="emails"
          name="emails"
          multiple
          placeholder="e.g. a@b.com, c@d.com"
        />
        <button type="submit">Submit</button>
      </form>
    </div>

    <script src="/09_forms.js"></script>
  </body>
</html>
